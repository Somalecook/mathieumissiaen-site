[build]
  publish = "."
  # regenerates the SEO pages (work/*, sitemap.xml…) from content/*.json on every deploy
  command = "python3 build.py"

[[headers]]
  for = "/images/*"
  [headers.values]
    Cache-Control = "public, max-age=604800"

[[headers]]
  for = "/content/*"
  [headers.values]
    Cache-Control = "no-cache"

[[redirects]]
  from = "/stickoo/app"
  to = "/stickoo/app/"
  status = 301

[[headers]]
  for = "/stickoo/app/*"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow"

[[redirects]]
  from = "/services/ai/*"
  to = "/services/cgi/"
  status = 301
